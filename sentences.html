<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Sentences — koindian</title>
<meta name="description" content="Real Korean sentences for everyday situations — restaurant, shopping, directions, and more.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="site-nav" id="site-nav"></nav>

<header class="hero" style="padding:52px 0 60px;">
  <div class="wrap" style="grid-template-columns:1fr;">
    <div>
      <div class="eyebrow" style="color:var(--marigold);">Daily Sentences · दैनिक वाक्य</div>
      <h1 style="font-size:clamp(2rem,4vw,2.8rem);">23 sentences, 5 situations</h1>
      <p class="lede">रेस्टोरेंट, खरीदारी, रास्ता पूछना और आपातकाल — रोज़मर्रा में तुरंत काम आने वाले वाक्य।</p>
    </div>
  </div>
</header>

<section class="section-tight">
  <div class="wrap" id="sentence-groups"></div>
</section>

<footer class="site-footer" id="site-footer"></footer>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const mount = document.getElementById("sentence-groups");
  mount.innerHTML = KOINDIAN.dailySentenceGroups.map(group => `
    <div style="margin-bottom:40px;">
      <h3 style="font-size:1.15rem;margin-bottom:14px;">${group.title} <span class="kr" style="color:var(--plum);font-size:1rem;font-weight:500;">${group.titleKo}</span></h3>
      ${group.sentences.map(s => `
        <div class="sentence-row">
          <div>
            <div class="ko kr">${s.ko}</div>
            <div class="hi">${s.hi}</div>
          </div>
        </div>
      `).join("")}
    </div>
  `).join("");
});
</script>
</body>
</html>
