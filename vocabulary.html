<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vocabulary — koindian</title>
<meta name="description" content="15 categories, 751 words — Korean, romanization, and Hindi meaning.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="site-nav" id="site-nav"></nav>

<header class="hero" style="padding:52px 0 60px;">
  <div class="wrap" style="grid-template-columns:1fr;">
    <div>
      <div class="eyebrow" style="color:var(--marigold);">Vocabulary · शब्दावली</div>
      <h1 style="font-size:clamp(2rem,4vw,2.8rem);">751 words, 15 categories</h1>
      <p class="lede">परिवार से लेकर मौसम तक — हर कैटेगरी में असली, सही कोरियाई शब्द, उच्चारण और हिंदी अर्थ के साथ।</p>
    </div>
  </div>
</header>

<section class="section-tight">
  <div class="wrap">
    <div class="search-box" style="margin-bottom:24px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="vocab-search" placeholder="शब्द खोजें... (search any word)">
    </div>
    <div class="category-pills" id="category-pills"></div>
    <div id="vocab-content"></div>
  </div>
</section>

<footer class="site-footer" id="site-footer"></footer>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const pillsEl = document.getElementById("category-pills");
  const contentEl = document.getElementById("vocab-content");
  const searchEl = document.getElementById("vocab-search");
  let activeCategory = "all";

  function renderPills() {
    const pills = [{ id: "all", title: "All", titleKo: "" }, ...KOIND.vocabularyCategories];
    pillsEl.innerHTML = pills.map(c => `
      <button class="pill ${c.id === activeCategory ? "active" : ""}" data-id="${c.id}">
        ${c.title}${c.titleKo ? ` · ${c.titleKo}` : ""}
      </button>
    `).join("");
    pillsEl.querySelectorAll(".pill").forEach(btn => {
      btn.addEventListener("click", () => {
        activeCategory = btn.dataset.id;
        renderPills();
        renderContent();
      });
    });
  }

  function renderContent() {
    const query = searchEl.value.trim().toLowerCase();
    const categories = activeCategory === "all"
      ? KOIND.vocabularyCategories
      : KOIND.vocabularyCategories.filter(c => c.id === activeCategory);

    let html = "";
    categories.forEach(cat => {
      const words = cat.words.filter(w =>
        !query || w.ko.includes(searchEl.value.trim()) || w.hi.toLowerCase().includes(query) || (w.romanization||"").toLowerCase().includes(query)
      );
      if (words.length === 0) return;
      html += `
        <div style="margin-bottom:40px;">
          <h3 style="font-size:1.1rem;margin-bottom:14px;">${cat.title} <span class="kr" style="color:var(--plum);font-size:0.95rem;font-weight:500;">${cat.titleKo}</span> <span style="font-family:var(--font-mono);font-size:0.75rem;color:var(--ink-soft);font-weight:400;">(${words.length})</span></h3>
          <div class="vocab-grid">
            ${words.map(w => `
              <div class="vocab-word">
                <div>
                  <span class="ko kr">${w.ko}</span>
                  ${w.romanization ? `<span class="roman">${w.romanization}</span>` : ""}
                </div>
                <span class="hi">${w.hi}</span>
              </div>
            `).join("")}
          </div>
        </div>
      `;
    });

    contentEl.innerHTML = html || `<div class="empty-state"><p class="hi">कोई शब्द नहीं मिला।</p></div>`;
  }

  renderPills();
  renderContent();
  searchEl.addEventListener("input", renderContent);
});
</script>
</body>
</html>
